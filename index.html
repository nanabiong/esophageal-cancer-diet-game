<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食管癌饮食数感游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <section id="introScreen" class="storybook-cover">
      <p class="cover-kicker">互动绘本测试原型</p>
      <h1>食管癌饮食数感游戏</h1>
      <p class="cover-narration">从一个被闹钟叫醒的早晨开始，看看你的早餐会走向哪里。</p>
      <button id="startButton" type="button">翻开第一页</button>
    </section>

    <section id="actScreen" class="act-screen hidden">
      <div id="actViewport" class="act-viewport"></div>
    </section>

    <section id="actEndScreen" class="report-card hidden">
      <p class="chapter-label">Act 1 结束</p>
      <h2>早餐这一页先合上了</h2>
      <p>第一幕选择已记录。请打开浏览器控制台查看 playerChoices。</p>
      <button id="restartActButton" type="button">重新体验早餐</button>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
